[project]
name = "bound"
version = "0.1.0"
description = "BOUND — com.razorpay.payments authorization handler"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "jinja2>=3.1.4",
  "httpx>=0.27.0",
  "razorpay>=1.4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]
agent = ["openai>=1.40.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bound*"]
